<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>משוב על המבדק</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c1c28;--ink-2:#4a4a5a;--ink-3:#7a7a88;--line:#d9d9e2;--soft:#f6f5fa;--accent:#3d3a8c;--orange:#e8743b;--ok:#1b7a4b;--bad:#b3261e;--sans:"Almoni Neue","Heebo","Arial",sans-serif;}
*{box-sizing:border-box;}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:17.5px;line-height:1.8;direction:rtl;text-align:right;background:#fff;}
.wrap{max-width:820px;margin:0 auto;padding:0 clamp(18px,5vw,40px);}
.bar{border-bottom:3px solid var(--orange);} .bar .wrap{padding-top:14px;padding-bottom:10px;}
.bar h1{margin:0;font-size:21px;color:var(--accent);}
.pill{display:inline-flex;align-items:center;border:1.5px solid var(--line);background:#fff;color:var(--ink-2);border-radius:999px;padding:6px 22px;font:inherit;font-size:16px;font-weight:500;cursor:pointer;text-decoration:none;}
.pill.go{background:var(--orange);border-color:var(--orange);color:#fff;}
input.txt{border:2px solid #9a9aa8;border-radius:10px;padding:8px 14px;font:inherit;font-size:20px;letter-spacing:4px;direction:ltr;text-transform:uppercase;width:220px;text-align:center;}
.form{margin:36px 0;padding:22px 24px;background:var(--soft);border-radius:14px;}
.err{color:var(--bad);font-weight:500;min-height:1.4em;margin:10px 0 0;}
.sum{margin:30px 0 8px;padding:18px 22px;border:2px solid var(--line);border-radius:14px;}
.sum h2{margin:0;font-size:28px;color:var(--accent);} .sum .big{font-size:42px;font-weight:700;color:var(--accent);}
.gen{margin:18px 0;padding:14px 18px;background:#fff7f0;border-right:5px solid var(--orange);border-radius:8px;}
.item{margin-top:34px;padding-top:6px;border-top:1px solid var(--line);}
.item .h{display:flex;gap:14px;align-items:flex-start;}
.qn{flex:none;min-width:40px;height:40px;border:2px solid var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent);font-size:18px;margin-top:2px;}
.stem{font-weight:500;flex:1;} .pts{flex:none;font-weight:700;padding:2px 12px;border-radius:999px;font-size:15px;background:var(--soft);}
.pts.full{background:#e4f4ea;color:var(--ok);} .pts.zero{background:#fbe6e4;color:var(--bad);} .pts.part{background:#fff1e0;color:#a85a00;}
.part{margin:12px 0 0 0;padding:12px 16px;background:var(--soft);border-radius:10px;font-size:16.5px;}
.lab{font-weight:700;color:var(--accent);font-size:15px;margin:8px 0 0;}
.ans{white-space:pre-wrap;} .ok{color:var(--ok);font-weight:700;} .no{color:var(--bad);font-weight:700;}
.fbt{margin-top:10px;padding:10px 14px;background:#fff;border:2px solid var(--orange);border-radius:10px;}
footer{margin:60px 0 30px;border-top:1px solid var(--line);padding-top:16px;font-size:14.5px;color:var(--ink-3);}
footer a{text-decoration:none;font-weight:700;color:var(--accent);}
.stars{display:inline-flex;gap:2px;direction:ltr;vertical-align:middle;}
</style>
</head>
<body>
<header class="bar"><div class="wrap"><h1>משוב על המבדק</h1></div></header>
<main class="wrap">
  <div class="form" id="form">
    <p style="margin:0 0 10px">הקלידי את הקוד האישי שקיבלת בסוף המבדק.</p>
    <input class="txt" id="code" type="text" maxlength="8" autocomplete="off" aria-label="קוד אישי">
    <button type="button" class="pill go" id="go" style="margin-inline-start:10px">צפייה במשוב</button>
    <p class="err" id="err" role="alert"></p>
  </div>
  <div id="out"></div>
</main>
<footer><div class="wrap">נבנה על ידי <a href="https://chepti.com" target="_blank" rel="noopener">חולמים תקשוב</a></div></footer>
<script>
(function(){
var $=function(i){return document.getElementById(i);};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function cls(got,max){return got>=max?'full':(got<=0?'zero':'part');}
function render(d){
  var h='<div class="sum"><div>'+esc(d.name)+'</div><div class="big">'+d.total+' <span style="font-size:22px;color:var(--ink-3)">מתוך '+d.max+'</span></div></div>';
  if(d.general)h+='<div class="gen"><b>מהמורה:</b><br>'+esc(d.general)+'</div>';
  d.items.forEach(function(it){
    h+='<div class="item"><div class="h"><div class="qn">'+it.n+'</div><div class="stem">'+esc(it.stem)+'</div><div class="pts '+cls(it.got,it.max)+'">'+it.got+' / '+it.max+'</div></div>';
    it.parts.forEach(function(p){
      h+='<div class="part">';
      if(p.label)h+='<div class="lab">'+esc(p.label)+'</div>';
      if(p.kind==='open'){
        h+='<div class="lab">התשובה שלך</div><div class="ans">'+esc(p.ans)+'</div>';
        h+='<div class="lab">ניקוד: '+(p.score==null?'עוד לא נבדק':p.score+' מתוך '+p.max)+'</div>';
        if(p.feedback)h+='<div class="fbt"><b>משוב מהמורה:</b><br>'+esc(p.feedback)+'</div>';
        if(p.model)h+='<div class="lab">תשובה לדוגמה</div><div>'+esc(p.model)+'</div>';
      }else{
        h+='<div class="lab">התשובה שלך</div><div class="ans"><span class="'+(p.ok?'ok':'no')+'">'+(p.ok?'נכון. ':'לא מדויק. ')+'</span>'+esc(p.ans)+'</div>';
        if(!p.ok&&p.correct)h+='<div class="lab">התשובה הנכונה</div><div>'+esc(p.correct)+'</div>';
        if(p.explain)h+='<div class="lab">הסבר</div><div>'+esc(p.explain)+'</div>';
      }
      h+='</div>';
    });
    h+='</div>';
  });
  $('out').innerHTML=h;$('form').style.display='none';window.scrollTo(0,0);
}
function go(){
  $('err').textContent='';
  var c=$('code').value;$('go').disabled=true;
  google.script.run.withSuccessHandler(function(d){$('go').disabled=false;if(d&&d.ok)render(d);else $('err').textContent=(d&&d.error)||'שגיאה';})
   .withFailureHandler(function(){$('go').disabled=false;$('err').textContent='החיבור נכשל. נסי שוב.';}).getFeedback(c);
}
$('go').addEventListener('click',go);
$('code').addEventListener('keydown',function(e){if(e.key==='Enter')go();});
})();
</script>
</body>
</html>
